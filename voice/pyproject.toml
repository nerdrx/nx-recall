[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nx-recall-voice"
version = "0.1.0"
description = "Offline conversational voice worker owned by NX Recall"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "sherpa-onnx==1.13.6", "piper-tts>=1.8,<2"]

[tool.setuptools.packages.find]
include = ["nx_recall_voice*"]
