[package]
name = "nx-recall-overlay"
description = "Live captions as an OpenXR overlay layer — and the probe that says whether this runtime can host one"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
# The OpenXR loader, and the extension set that carries `extx_overlay`. 0.21 is
# generated against SDK 1.1 and already knows XR_EXTX_overlay's structure chain,
# which is the whole reason this route is worth probing at all.
openxr = "0.21"
fontdue = "0.9"
ash = "0.38"
# The desktop path (`--desktop`). wlr-layer-shell, wl_shm and an EMPTY input
# region — the one thing Electron cannot say on Wayland. 0.21 is the version
# nx-wisp's layer surface is proven against on this KWin, pinned to match.
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
# poll(2), pipe2(2) and inotify, so the draw loop can sleep on three fds at
# once. Already a workspace dependency; declaring it here also retires the
# hand-rolled `getuid` in feed.rs.
libc.workspace = true
