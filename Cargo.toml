[workspace]
resolver = "3"
members = ["crates/recalld"]

[workspace.package]
version = "0.6.4"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
bzip2 = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hound = "3.5"
libc = "0.2"
ort = "2.0.0-rc.13"
pipewire = { version = "0.10", features = ["v1_2_0"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
sherpa-rs = "0.6"
serde = { version = "1", features = ["derive"] }
tar = "0.4"
# Semantic search only (crate::semantic): the HuggingFace tokenizer that the
# sentence-embedding model was trained with. Default features off on purpose —
# they pull in a C++ suffix-array build (`esaxx_fast`) and a progress bar that
# only the *training* paths use, and an inference-only dependency must not need
# a C++ toolchain to build. `fancy-regex` rather than the default `onig` for the
# same reason: it is the pure-Rust one of the two required regex backends.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `models fetch` only (crate::fetch). rustls, not native-tls: a binary shipped
# in a tarball must not depend on whichever libssl the build machine had.
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
