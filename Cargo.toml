[workspace]
resolver = "3"
members = ["crates/recalld"]

[workspace.package]
version = "0.7.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
bzip2 = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
# `models fetch` only, for the llama.cpp release tarball (crate::fetch). The
# pure-Rust backend on purpose: a binary shipped in a tarball must not depend on
# whichever zlib the build machine had, for the same reason ureq uses rustls.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hound = "3.5"
libc = "0.2"
ort = "2.0.0-rc.13"
pipewire = { version = "0.10", features = ["v1_2_0"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
sherpa-rs = "0.6"
serde = { version = "1", features = ["derive"] }
tar = "0.4"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `models fetch` only (crate::fetch). rustls, not native-tls: a binary shipped
# in a tarball must not depend on whichever libssl the build machine had.
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
