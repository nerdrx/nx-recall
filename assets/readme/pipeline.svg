<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Menlo,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0716"/><stop offset="1" stop-color="#110a22"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1435"/><stop offset="1" stop-color="#140d27"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1653"/><stop offset="1" stop-color="#1b0e35"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#7f6ab8"/>
    </marker>
  </defs>
  <rect width="1400" height="620" fill="url(#bg)"/>

  <g stroke="#7700FF" stroke-width="2.5" fill="none" opacity=".85">
    <path d="M22 22 h26 M22 22 v26"/><path d="M1378 22 h-26 M1378 22 v26"/>
    <path d="M22 598 h26 M22 598 v-26"/><path d="M1378 598 h-26 M1378 598 v-26"/>
  </g>
  <text x="700" y="50" text-anchor="middle" fill="#6f6396" font-size="15" letter-spacing="6">ONE MACHINE · NO EXITS · EVERY STAGE MEASURED</text>

  <!-- row 1: capture -->
  <g stroke="#453470" stroke-width="1.5">
    <rect x="40"  y="78" width="216" height="88" rx="10" fill="url(#box)"/>
    <rect x="306" y="78" width="196" height="88" rx="10" fill="url(#box)"/>
    <rect x="552" y="78" width="206" height="88" rx="10" fill="url(#box)"/>
  </g>
  <g fill="#e8e2f7" font-size="16.5" text-anchor="middle" font-weight="700">
    <text x="148" y="110">PIPEWIRE TAPS + MIC</text>
    <text x="404" y="110">16 kHz · ONE CLOCK</text>
    <text x="655" y="110">VAD + TURN MERGE</text>
  </g>
  <g fill="#8f83b8" font-size="12" text-anchor="middle">
    <text x="148" y="132">default-deny apps · the mic</text><text x="148" y="148">follows your session</text>
    <text x="404" y="132">stamped at capture</text><text x="404" y="148">UTC ns, never local</text>
    <text x="655" y="132">silero · gaps ≤ 1.5 s join</text><text x="655" y="148">a gap discards, never splices</text>
  </g>

  <!-- the gate -->
  <g stroke="#7700FF" stroke-width="2">
    <rect x="822" y="70" width="242" height="104" rx="10" fill="url(#hot)"/>
  </g>
  <g text-anchor="middle">
    <text x="943" y="102" fill="#f2eefc" font-size="16.5" font-weight="700">OVERLAP GATE</text>
    <text x="943" y="124" fill="#a794d6" font-size="12">0.0% false alarms · 98% of</text>
    <text x="943" y="140" fill="#a794d6" font-size="12">equal-loudness crosstalk caught</text>
    <text x="943" y="160" fill="#a794d6" font-size="12">refuses to guess, on purpose</text>
  </g>

  <!-- row 2: the two legs + language prior -->
  <g stroke="#453470" stroke-width="1.5">
    <rect x="640" y="228" width="240" height="96" rx="10" fill="url(#box)"/>
    <rect x="1120" y="228" width="240" height="96" rx="10" fill="url(#box)"/>
    <rect x="880" y="228" width="240" height="96" rx="10" fill="url(#hot)" stroke="#5b3f96"/>
  </g>
  <g text-anchor="middle">
    <text x="760" y="258" fill="#e8e2f7" font-size="16" font-weight="700">ASR · PARAKEET v3</text>
    <text x="760" y="280" fill="#8f83b8" font-size="12">25 languages · 1.4% en · 8.4% de</text>
    <text x="760" y="296" fill="#8f83b8" font-size="12">blank on babble, never fiction</text>
    <text x="1000" y="258" fill="#f2eefc" font-size="15.5" font-weight="700">LANGUAGE PRIOR</text>
    <text x="1000" y="278" fill="#a794d6" font-size="11.5">a German thread makes the</text>
    <text x="1000" y="292" fill="#a794d6" font-size="11.5">unreadable German · flips go to</text>
    <text x="1000" y="306" fill="#a794d6" font-size="11.5">constrained arbiters, guarded</text>
    <text x="1240" y="258" fill="#e8e2f7" font-size="16" font-weight="700">VOICEBANK</text>
    <text x="1240" y="280" fill="#8f83b8" font-size="12">clean single voices only ·</text>
    <text x="1240" y="296" fill="#8f83b8" font-size="12">label &lt; mint &lt; enroll ladder</text>
  </g>

  <!-- row 3: the store plane -->
  <g stroke="#453470" stroke-width="1.5">
    <rect x="40"  y="392" width="320" height="96" rx="10" fill="url(#box)"/>
    <rect x="410" y="392" width="290" height="96" rx="10" fill="url(#box)"/>
    <rect x="750" y="392" width="300" height="96" rx="10" fill="url(#box)"/>
  </g>
  <g text-anchor="middle">
    <text x="200" y="422" fill="#e8e2f7" font-size="16" font-weight="700">SQLITE · WAL · FTS5</text>
    <text x="200" y="444" fill="#8f83b8" font-size="12">provenance on every row · merges</text>
    <text x="200" y="460" fill="#8f83b8" font-size="12">tombstone · deletes cascade + VACUUM</text>
    <text x="555" y="422" fill="#e8e2f7" font-size="16" font-weight="700">MEANING INDEX</text>
    <text x="555" y="444" fill="#8f83b8" font-size="12">multilingual vectors, hub-corrected —</text>
    <text x="555" y="460" fill="#8f83b8" font-size="12">the German query finds the English turn</text>
    <text x="900" y="422" fill="#e8e2f7" font-size="16" font-weight="700">MEMORY · THREADS</text>
    <text x="900" y="444" fill="#8f83b8" font-size="12">conversations untangled · promises +</text>
    <text x="900" y="460" fill="#8f83b8" font-size="12">topics by a 1.9 GB model, idle, jailed</text>
  </g>

  <!-- row 4: clients -->
  <g stroke="#453470" stroke-width="1.5">
    <rect x="410" y="524" width="290" height="58" rx="10" fill="url(#box)"/>
    <rect x="40" y="524" width="320" height="58" rx="10" fill="url(#box)"/>
  </g>
  <text x="200" y="559" text-anchor="middle" fill="#e8e2f7" font-size="15" font-weight="700">UNIX SOCKET · SEQ · RESYNC</text>
  <text x="555" y="559" text-anchor="middle" fill="#e8e2f7" font-size="15" font-weight="700">GUI · TRAY · CLI</text>

  <!-- flows -->
  <g stroke="#7f6ab8" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M256 122 H300"/>
    <path d="M502 122 H546"/>
    <path d="M758 122 H816"/>
    <path d="M900 174 C860 200 800 210 776 222"/>
    <path d="M1000 174 V222"/>
    <path d="M1064 150 C1160 170 1210 195 1236 222"/>
    <path d="M880 276 H886" opacity="0"/>
    <path d="M760 324 C700 360 400 370 300 386"/>
    <path d="M1240 324 C1200 360 400 400 364 428" opacity=".7"/>
    <path d="M760 324 C700 350 620 366 578 386"/>
    <path d="M900 324 V386" opacity=".8"/>
    <path d="M360 440 H404"/>
    <path d="M200 488 V518"/>
    <path d="M410 553 H366" opacity="0"/>
    <path d="M410 550 H366"/>
  </g>
  <g stroke="#7f6ab8" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="3 4">
    <path d="M880 276 H886"/>
    <path d="M756 276 H700" opacity="0"/>
  </g>
  <g font-size="11" fill="#6f6396">
    <text x="830" y="200">always</text>
    <text x="1052" y="208">clean voices only</text>
    <text x="1012" y="352">text · lang · overlap · vector</text>
    <text x="905" y="365">threads feed the prior</text>
  </g>
</svg>
