<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Menlo,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0716"/><stop offset="1" stop-color="#110a22"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1435"/><stop offset="1" stop-color="#140d27"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1653"/><stop offset="1" stop-color="#1b0e35"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#7f6ab8"/>
    </marker>
  </defs>
  <rect width="1400" height="430" fill="url(#bg)"/>

  <g stroke="#7700FF" stroke-width="2.5" fill="none" opacity=".85">
    <path d="M22 22 h26 M22 22 v26"/><path d="M1378 22 h-26 M1378 22 v26"/>
    <path d="M22 408 h26 M22 408 v-26"/><path d="M1378 408 h-26 M1378 408 v-26"/>
  </g>
  <text x="700" y="52" text-anchor="middle" fill="#6f6396" font-size="15" letter-spacing="6">ONE MACHINE · NO EXITS</text>

  <!-- row 1 -->
  <g stroke="#453470" stroke-width="1.5">
    <rect x="46"  y="88" width="196" height="86" rx="10" fill="url(#box)"/>
    <rect x="292" y="88" width="196" height="86" rx="10" fill="url(#box)"/>
    <rect x="538" y="88" width="196" height="86" rx="10" fill="url(#box)"/>
  </g>
  <g fill="#e8e2f7" font-size="17" text-anchor="middle" font-weight="700">
    <text x="144" y="124">PIPEWIRE TAPS</text>
    <text x="390" y="124">16 kHz MONO</text>
    <text x="636" y="124">VAD + TURN MERGE</text>
  </g>
  <g fill="#8f83b8" font-size="12.5" text-anchor="middle">
    <text x="144" y="146">per-app streams</text><text x="144" y="162">default-deny allowlist</text>
    <text x="390" y="146">one monotonic clock</text><text x="390" y="162">stamped at capture</text>
    <text x="636" y="146">silero · gaps under 1.5 s</text><text x="636" y="162">become one turn</text>
  </g>

  <!-- the gate -->
  <g stroke="#7700FF" stroke-width="2">
    <rect x="812" y="80" width="240" height="102" rx="10" fill="url(#hot)"/>
  </g>
  <g text-anchor="middle">
    <text x="932" y="112" fill="#f2eefc" font-size="17" font-weight="700">OVERLAP GATE</text>
    <text x="932" y="134" fill="#a794d6" font-size="12.5">pyannote powerset</text>
    <text x="932" y="152" fill="#a794d6" font-size="12.5">refuses to guess when</text>
    <text x="932" y="168" fill="#a794d6" font-size="12.5">several people talk at once</text>
  </g>

  <!-- row 2: the two legs -->
  <g stroke="#453470" stroke-width="1.5">
    <rect x="812" y="232" width="240" height="80" rx="10" fill="url(#box)"/>
    <rect x="1114" y="232" width="240" height="80" rx="10" fill="url(#box)"/>
  </g>
  <g text-anchor="middle">
    <text x="932" y="264" fill="#e8e2f7" font-size="16" font-weight="700">ASR · PARAKEET v3</text>
    <text x="932" y="286" fill="#8f83b8" font-size="12.5">25 languages · every segment</text>
    <text x="1234" y="264" fill="#e8e2f7" font-size="16" font-weight="700">VOICEBANK MATCH</text>
    <text x="1234" y="286" fill="#8f83b8" font-size="12.5">single-speaker audio only</text>
  </g>

  <!-- row 3: store + clients -->
  <g stroke="#453470" stroke-width="1.5">
    <rect x="46"  y="232" width="286" height="80" rx="10" fill="url(#box)"/>
    <rect x="392" y="232" width="286" height="80" rx="10" fill="url(#box)"/>
  </g>
  <g text-anchor="middle">
    <text x="189" y="264" fill="#e8e2f7" font-size="16" font-weight="700">SQLITE · WAL · FTS5</text>
    <text x="189" y="286" fill="#8f83b8" font-size="12.5">provenance on every row</text>
    <text x="535" y="264" fill="#e8e2f7" font-size="16" font-weight="700">UNIX SOCKET 0600</text>
    <text x="535" y="286" fill="#8f83b8" font-size="12.5">seq events · replay · resync</text>
  </g>
  <g stroke="#453470" stroke-width="1.5">
    <rect x="392" y="344" width="286" height="56" rx="10" fill="url(#box)"/>
  </g>
  <text x="535" y="378" text-anchor="middle" fill="#e8e2f7" font-size="15" font-weight="700">GUI · TRAY · CLI</text>

  <!-- flows -->
  <g stroke="#7f6ab8" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M242 131 H286"/>
    <path d="M488 131 H532"/>
    <path d="M734 131 H806"/>
    <path d="M932 182 V226"/>
    <path d="M1052 152 C1120 168 1180 190 1226 226"/>
    <path d="M812 272 C640 272 700 272 684 272"/>
    <path d="M1114 288 C900 356 520 320 480 316" opacity=".8"/>
    <path d="M332 272 H386"/>
    <path d="M535 312 V338"/>
  </g>
  <g font-size="11.5" fill="#6f6396">
    <text x="948" y="208">always</text>
    <text x="1090" y="196">clean voices only</text>
    <text x="800" y="262" text-anchor="end">text + lang + overlap</text>
    <text x="860" y="345">identity + score</text>
  </g>
</svg>
