<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NX Recall">
  <title>NX Recall</title>
<!--
  Master variant of the NX Recall mark (DESIGN §8): a beveled glass crystal
  hexagon, POINTY-TOP, with the app's own monogram. Light comes from the upper
  left in every gradient here, as it does everywhere else in the system.
  Never scale this below 48px — use icon-small.svg / tray.svg instead.
-->
  <defs>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#a06bf9"/>
      <stop offset="0.42" stop-color="#7700ff"/>
      <stop offset="1" stop-color="#3d0d86"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0.1" y1="0" x2="0.7" y2="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="well" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1a0b33"/>
      <stop offset="1" stop-color="#0a0416"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e2c8ff"/>
      <stop offset="1" stop-color="#8fd8ff"/>
    </linearGradient>
    <radialGradient id="refract" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- outer crystal -->
  <path d="M240.13,18.49Q256,10 271.87,18.49L470.13,124.51Q486,133 486,151L486,361Q486,379 470.13,387.49L271.87,493.51Q256,502 240.13,493.51L41.87,387.49Q26,379 26,361L26,151Q26,133 41.87,124.51Z" fill="url(#body)"/>
  <!-- bevel: the lit upper-left facet -->
  <path d="M240.13,18.49Q256,10 271.87,18.49L470.13,124.51Q486,133 486,151L486,361Q486,379 470.13,387.49L271.87,493.51Q256,502 240.13,493.51L41.87,387.49Q26,379 26,361L26,151Q26,133 41.87,124.51Z" fill="url(#bevel)"/>
  <!-- recessed well the monogram sits in -->
  <path d="M243.6,62.2Q256,55 268.4,62.2L446.6,157.4Q459,164 459,178L459,334Q459,348 446.6,354.8L268.4,449.8Q256,457 243.6,449.8L65.4,354.8Q53,348 53,334L53,178Q53,164 65.4,157.4Z" fill="url(#well)"/>
  <path d="M243.6,62.2Q256,55 268.4,62.2L446.6,157.4Q459,164 459,178L459,334Q459,348 446.6,354.8L268.4,449.8Q256,457 243.6,449.8L65.4,354.8Q53,348 53,334L53,178Q53,164 65.4,157.4Z" fill="url(#refract)"/>

  <!-- monogram R, geometric strokes, butt caps and miter joins (angular, §2) -->
  <g fill="none" stroke="url(#glyph)" stroke-width="36" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4">
    <path d="M197,352L197,160L281,160L281,160"/>
    <path d="M197,160L281,160Q327,160 327,206Q327,252 281,252L197,252"/>
    <path d="M262,252L330,352"/>
  </g>
  <!-- one cyan light line: what the app listens to -->
  <path d="M150,300L150,332M170,288L170,344M190,308L190,324" stroke="#00e5ff" stroke-opacity="0.55" stroke-width="10" stroke-linecap="butt"/>
</svg>
