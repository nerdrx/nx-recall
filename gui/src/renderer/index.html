<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No network anywhere in this app: connect-src is 'none' and there is no
         remote origin in any directive. The only transport is the unix socket,
         and only the main process touches it.

         media-src blob: is the one addition (0.5.4, voice preview): a segment's
         WAV arrives base64 inside a protocol reply and is wrapped in a blob URL
         to hand to <audio>. blob: is same-origin by construction and fetches
         nothing — connect-src stays 'none'. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src blob:; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NX Recall</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./views/search014.css" />
    <link rel="stylesheet" href="./views/memory014.css" />
    <link rel="stylesheet" href="./release014.css" />
  </head>
  <body>
    <!-- NX Clear (DESIGN §14): there is no living background any more. The
         drifting nebula, the vignette and the anti-banding noise film all
         belonged to the deep-space ground and went with it; the page is a flat
         token colour with one soft off-screen bloom, painted on <body>. -->
    <div class="shell">
      <!-- The daemon can replace itself under a running window (0.5.3). When it
           comes back as a different version this says so above every view, not
           only the one that happens to be mounted. -->
      <div class="update-bar" id="update-bar" role="status" hidden></div>

      <!-- Somebody you have named walked into the instance (0.8.0). Same
           component family as the notice above it, and for the same reason:
           it is a fact about the whole app rather than about whichever view
           happens to be mounted, it is one line, and it can be waved away. -->
      <div class="update-bar brief-bar" id="brief-bar" role="status" hidden></div>

      <nav class="rail" aria-label="Views">
        <div class="rail-brand">
          <img src="../../assets/icons/48x48.png" alt="" width="30" height="30" />
          <span>
            <span class="nx-wordmark" role="img" aria-label="NX">
              <img class="nx-wordmark-violet" src="../../assets/brand/nx-wordmark-violet.svg" alt="" />
              <img class="nx-wordmark-light" src="../../assets/brand/nx-wordmark-light.svg" alt="" />
            </span>
            <small>Recall · local only</small>
          </span>
        </div>

        <div class="rail-nav" role="tablist" aria-orientation="vertical">
          <button class="rail-item" role="tab" title="Transcript · Ctrl/Alt+1" data-view="transcript" aria-selected="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M4 5h16M4 10h11M4 15h16M4 20h8" stroke-linecap="square" />
            </svg>
            <span>Transcript</span>
            <span class="badge" id="badge-transcript">0</span>
          </button>
          <button class="rail-item" role="tab" title="Speakers · Ctrl/Alt+2" data-view="speakers" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M4 20v-2a4 4 0 0 1 4-4h3a4 4 0 0 1 4 4v2M6 7.5a3.5 3.5 0 1 0 7 0 3.5 3.5 0 0 0-7 0M17 13h1a3 3 0 0 1 3 3v2M17 5.2a2.8 2.8 0 1 1 0 5.6" stroke-linecap="square" />
            </svg>
            <span>Speakers</span>
            <span class="badge" id="badge-speakers">0</span>
          </button>
          <button class="rail-item" role="tab" title="Search · Ctrl/Alt+3" data-view="search" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14M16 16l4.5 4.5" stroke-linecap="square" />
            </svg>
            <span>Search</span>
          </button>
          <!-- The memory graph's own place (0.7.0, docs/GRAPH.md): who owes
               what to whom, what you keep talking about, and whether the local
               model is allowed to look. A rail item rather than pushed state,
               because it is not a detail of any of the other four. The glyph is
               a speech bubble with a thread through it — what was said, and
               what was made of it. -->
          <button class="rail-item" role="tab" title="Memory · Ctrl/Alt+4" data-view="memory" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M4 5h16v11H9l-5 4z M8 9h8M8 12.5h5" stroke-linecap="square" />
            </svg>
            <span>Memory</span>
            <span class="badge" id="badge-memory">0</span>
          </button>
          <button class="rail-item" role="tab" title="Sources · Ctrl/Alt+5" data-view="sources" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M4 8v8M8 5v14M12 9v6M16 3v18M20 8v8" stroke-linecap="square" />
            </svg>
            <span>Sources</span>
            <span class="badge" id="badge-sources">0</span>
          </button>
          <button class="rail-item" role="tab" data-view="settings" aria-selected="false" title="Settings · Ctrl/Alt+6">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6" /></svg>
            <span>Settings</span>
          </button>
        </div>

        <!-- Live captions (0.8.3). Deliberately BELOW the tablist and not in
             it: the other five buttons swap what this window is showing, and
             this one puts a different window on top of your game. It is an
             action, so it is a plain button with no `data-view`, no
             aria-selected, and no place in the 1–5 keyboard map. There is no
             hotkey for it anywhere — a global grab is a thing that breaks
             somebody's game — so this, the tray, and `nx-recall --captions`
             are the three ways in. -->
        <div class="rail-actions">
          <button class="rail-item rail-action" id="captions-btn" data-action="captions" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M3 5h18v12H3z M7 10h4M7 13h7M14 10h3" stroke-linecap="square" />
            </svg>
            <span>Captions</span>
          </button>
        </div>

        <!-- Pause surface #2 (the tray dropdown is #1) — DESIGN §8. -->
        <div class="rail-pause">
          <button class="pause-btn" id="pause-btn" data-paused="false" disabled>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" id="pause-ico">
              <rect x="6" y="5" width="4" height="14"></rect>
              <rect x="14" y="5" width="4" height="14"></rect>
            </svg>
            <span id="pause-label">Pause capture</span>
          </button>
          <p class="rail-hint" id="pause-hint">Capture stops immediately. Nothing is written while paused.</p>
        </div>
      </nav>

      <main class="main" id="main"></main>

      <footer class="footer" id="footer"></footer>
    </div>

    <div id="sheet-root"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
